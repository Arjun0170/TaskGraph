name: C++ checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure with sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build -j 2
      - name: Test invariants and fixtures
        run: ctest --test-dir build --output-on-failure -V
      - name: Reproduce policy comparison
        run: python3 benchmark.py build/taskgraph
